[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay"
version = "0.1.0"
description = "Local, opt-in task bridge for bridge-owned Claude Code sessions"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
gcb = "gcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
